# Astro sitesini derleyip GitHub Pages'e yayınlar.
# GitHub > Settings > Pages > Build and deployment > Source: "GitHub Actions" seçili olmalı;
# aksi hâlde GitHub varsayılan Jekyll derlemesini çalıştırır ve .astro dosyalarında hata verir.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın; sürmekte olan yayın yarıda kesilmez.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Demo arama motorlarına kapalı kalır. Üretimde repo değişkeni
      # (Settings > Secrets and variables > Actions > Variables) ile "true" yapılabilir.
      PUBLIC_ALLOW_INDEXING: ${{ vars.PUBLIC_ALLOW_INDEXING || 'false' }}
      DATA_SOURCE: mock
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build and upload site (npm, package-lock.json)
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: npm

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
